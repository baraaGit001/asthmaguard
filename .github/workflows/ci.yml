name: ci
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.5
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: asthmaguard-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

  device:
    # Raspberry Pi Zero 2 W software, built and tested on arm64 Debian
    # Bookworm (same OS + architecture as Raspberry Pi OS 64-bit).
    runs-on: ubuntu-24.04-arm
    container: debian:bookworm
    timeout-minutes: 40
    steps:
      - run: apt-get update && apt-get install -y --no-install-recommends build-essential cmake pkg-config libsystemd-dev libasound2-dev git ca-certificates
      - uses: actions/checkout@v4
      - run: cmake -S device -B build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build -j4
      - run: ctest --test-dir build --output-on-failure
      - run: ./build/asthmaguardd --version
      - run: mkdir -p dist && cp build/asthmaguardd dist/ && cp -r device/deploy dist/
      - uses: actions/upload-artifact@v4
        with:
          name: asthmaguardd-arm64
          path: dist
          retention-days: 30

  ml-features:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install numpy scipy soundfile pytest
      - run: python -m pytest ml/tests -q
