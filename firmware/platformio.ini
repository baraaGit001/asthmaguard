; AsthmaGuard firmware
;   pio run -e pico2w            build for the Raspberry Pi Pico 2 W
;   pio run -e pico2w -t upload  flash (hold BOOTSEL when plugging in the first time)
;   pio test -e native           run the logic tests on the computer (no board needed)

[platformio]
default_envs = pico2w

[common]
lib_deps =
  bblanchon/ArduinoJson@7.2.1

[env:pico2w]
; Community RP2040/RP2350 platform with the earlephilhower Arduino-Pico core.
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = rpipico2w
framework = arduino
board_build.core = earlephilhower
board_build.filesystem_size = 0.5m
; 1 s audio window + model + arena need a large heap; leave stack defaults.
build_flags =
  -O2
  -DPIO_FRAMEWORK_ARDUINO_ENABLE_BLUETOOTH
  -DAG_FIRMWARE_VERSION=\"0.1.0\"
build_src_filter = +<*> -<.git/>
lib_deps =
  ${common.lib_deps}
  sparkfun/SparkFun MAX3010x Pulse and Proximity Sensor Library@1.1.2
monitor_speed = 115200
test_ignore = *

[env:native]
platform = native
test_framework = unity
build_flags = -std=gnu++17 -Wall -Wextra -Wno-unused-parameter -Isrc
lib_deps = ${common.lib_deps}
; Only the pure logic builds on the host.
build_src_filter =
  -<*>
  +<types.cpp> +<config.cpp> +<detector.cpp> +<state_machine.cpp>
  +<eventlog.cpp> +<sim.cpp> +<button.cpp> +<core.cpp> +<sensors/motion.cpp>
  +<sensors/features.cpp> +<sensors/ppg_algo.cpp>
test_build_src = yes
